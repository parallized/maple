name: Desktop Bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
      - "v*"

jobs:
  bundle:
    name: ${{ matrix.os }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build worker skills
        run: bun run --filter @maple/worker-skills build

      - name: Typecheck
        run: bun run --filter @maple/desktop typecheck

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y

      - name: Build Tauri bundle (macOS)
        if: runner.os == 'macOS'
        run: bun run --filter @maple/desktop tauri:build:dmg

      - name: Build Tauri bundle (Windows)
        if: runner.os == 'Windows'
        run: bun run --filter @maple/desktop tauri:build:msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maple-desktop-${{ runner.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**
